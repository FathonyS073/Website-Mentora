services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentora
      POSTGRES_USER: mentora
      POSTGRES_PASSWORD: ${MENTORA_DB_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mentora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentora -d mentora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mentora_pgdata:
